<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GreenPAK Web Editor</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header id="topbar">
    <h1>GreenPAK Web Editor <span class="chip">SLG46826V</span></h1>
    <div id="meter"></div>
    <div class="spacer"></div>
    <select id="lang-select" title="Language">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="zh">中文</option>
    </select>
    <select id="preset-select">
      <option value="" data-i18n="preset_placeholder">― 74シリーズ プリセット ―</option>
    </select>
    <button id="btn-connect" data-i18n="b_connect">接続</button>
    <button id="btn-settings" title="I2C">⚙</button>
  </header>
  <main>
    <aside id="palette">
      <h2 data-i18n="h_blocks">ブロック</h2>
      <div id="palette-buttons"></div>
      <h2 data-i18n="h_tools">ツール</h2>
      <div class="write-buttons">
        <button id="btn-autolayout" data-i18n="b_autolayout">✨ 自動整列</button>
        <button id="btn-autoconnect" data-i18n="b_autoconnect">🔗 自動接続</button>
      </div>
      <h2 data-i18n="h_write">書き込み</h2>
      <div class="write-buttons">
        <button id="btn-write-reg" disabled data-i18n="b_write_reg">レジスタへ書込 (揮発)</button>
        <button id="btn-write-nvm" disabled data-i18n="b_write_nvm">NVMへ書込 (不揮発)</button>
        <button id="btn-read-nvm" disabled data-i18n="b_read_nvm">NVM読出</button>
        <button id="btn-monitor" disabled data-i18n="b_monitor_off">📡 実機モニタ OFF</button>
      </div>
      <h2 data-i18n="h_file">ファイル</h2>
      <div class="write-buttons">
        <button id="btn-save" data-i18n="b_save">💾 保存 (JSON)</button>
        <button id="btn-load" data-i18n="b_load">📂 読込</button>
        <button id="btn-share" data-i18n="b_share">🔗 共有URLコピー</button>
        <input id="file-input" type="file" accept=".json" hidden />
      </div>
    </aside>
    <section id="canvas"></section>
    <aside id="right">
      <h2 data-i18n="h_props">プロパティ</h2>
      <div id="props"></div>
      <h2 data-i18n="h_conns">接続リスト</h2>
      <div id="conn-list"></div>
    </aside>
  </main>
  <footer id="log-panel">
    <h2 data-i18n="h_log">ログ</h2>
    <pre id="log"></pre>
  </footer>
  <dialog id="settings-dialog">
    <form method="dialog">
      <h2 data-i18n="d_title">ブリッジ設定 (M5StampS3)</h2>
      <label>SDA GPIO <input id="cfg-sda" type="number" min="0" max="48" value="13" /></label>
      <label>SCL GPIO <input id="cfg-scl" type="number" min="0" max="48" value="15" /></label>
      <label><span data-i18n="d_freq">I2C周波数</span> <select id="cfg-freq">
        <option value="100000">100 kHz</option>
        <option value="400000">400 kHz</option>
      </select></label>
      <label><input id="cfg-save" type="checkbox" checked /> <span data-i18n="d_save_nvs">本体NVSに保存する</span></label>
      <menu>
        <button value="cancel" data-i18n="d_cancel">キャンセル</button>
        <button value="ok" id="cfg-apply" data-i18n="d_apply">適用</button>
      </menu>
    </form>
  </dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
